<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <title id="t">The AI judge against the formula</title>
  <desc id="d">How often each puts the prospect I would write to above one I would not. Forward calls (108): AI judge 0.69, formula 0.71. Blind calls (70): AI judge 0.62, formula 0.72. 0.5 is a coin toss.</desc>
  <style>
    .bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e6e5e1}.coin{stroke:#8a8984}
    .s1{fill:#2a78d6}.s2{fill:#eb6834}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1a1a19}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.grid{stroke:#33322f}.coin{stroke:#8a8984}
      .s1{fill:#3987e5}.s2{fill:#d95926}
    }
    text{font-size:14px}.h{font-size:16px;font-weight:600}.small{font-size:12px}
  </style>
  <rect class="bg" width="640" height="300" rx="8"/>
  <text class="t1 h" x="24" y="32">Puts the right prospect first (dashed line: a coin toss)</text>
  <!-- legend -->
  <rect class="s1" x="24" y="48" width="12" height="12" rx="2"/><text class="t2" x="42" y="59">AI judge</text>
  <rect class="s2" x="120" y="48" width="12" height="12" rx="2"/><text class="t2" x="138" y="59">Formula</text>
  <!-- axis from zero: x = 160 + 550 * value -->
  <g class="small t2">
    <text x="160" y="284" text-anchor="middle">0</text>
    <text x="270" y="284" text-anchor="middle">0.2</text>
    <text x="380" y="284" text-anchor="middle">0.4</text>
    <text x="490" y="284" text-anchor="middle">0.6</text>
    <text x="600" y="284" text-anchor="middle">0.8</text>
  </g>
  <g class="grid" stroke-width="1">
    <line x1="270" y1="76" x2="270" y2="266"/><line x1="380" y1="76" x2="380" y2="266"/><line x1="490" y1="76" x2="490" y2="266"/><line x1="600" y1="76" x2="600" y2="266"/>
  </g>
  <line class="coin" x1="435" y1="76" x2="435" y2="266" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line class="grid" x1="160" y1="76" x2="160" y2="266" stroke-width="1"/>
  <!-- forward -->
  <text class="t1" x="24" y="112">Forward</text><text class="t2 small" x="24" y="130">108 calls</text>
  <g><title>Forward calls, AI judge: 0.69</title><rect class="s1" x="160" y="88" width="379" height="24" rx="4"/></g>
  <text class="t1" x="545" y="105">0.69</text>
  <g><title>Forward calls, formula: 0.71</title><rect class="s2" x="160" y="114" width="390" height="24" rx="4"/></g>
  <text class="t1" x="556" y="131">0.71</text>
  <!-- blind -->
  <text class="t1" x="24" y="208">Blind</text><text class="t2 small" x="24" y="226">70 calls, made before</text><text class="t2 small" x="24" y="241">seeing the judge</text>
  <g><title>Blind calls, AI judge: 0.62</title><rect class="s1" x="160" y="184" width="341" height="24" rx="4"/></g>
  <text class="t1" x="507" y="201">0.62</text>
  <g><title>Blind calls, formula: 0.72</title><rect class="s2" x="160" y="210" width="396" height="24" rx="4"/></g>
  <text class="t1" x="562" y="227">0.72</text>
</svg>
